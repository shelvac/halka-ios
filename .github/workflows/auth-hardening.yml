# Şifre politikası + güvenlik bildirimleri (US-013 devamı).
#
# Supabase'de "aynı şifreyi reddet" diye bir ayar YOK — o kontrol uygulama
# tarafında yapılıyor (SupabaseService.isSameAsCurrentPassword). Burada
# sunucuda ayarlanabilen kısımları sıkılaştırıyoruz:
#   - Asgari şifre uzunluğu 6 → 8 (uygulamadaki kuralla aynı olsun)
#   - Şifre değişikliği bildirimi AÇIK + markalı Türkçe şablon
name: Auth Sıkılaştırma

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      URL: https://api.supabase.com/v1/projects/urrjkubdngoszkttpeph/config/auth
    steps:
      - uses: actions/checkout@v4

      - name: Ayarları uygula
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          echo "## Auth sıkılaştırma" > r.md
          echo "" >> r.md
          OK=0; FAIL=0

          apply() {
            CODE=$(curl -s --max-time 45 -o /tmp/resp.json -w "%{http_code}" -X PATCH \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$URL" -d "$2")
            if [ "$CODE" = "200" ]; then
              echo "- ✅ $1" >> r.md; OK=$((OK+1))
            else
              echo "- ❌ $1 — \`$CODE: $(head -c 220 /tmp/resp.json | tr -d '\n')\`" >> r.md
              FAIL=$((FAIL+1))
            fi
          }

          apply "Asgari şifre uzunluğu 8" '{"password_min_length": 8}'

          # Güvenlik bildirimleri — hepsi varsayılanda kapalı ve İngilizce geliyor.
          # Kullanılmayanlar (telefon, MFA, davet, yeniden kimlik doğrulama) bilinçli
          # olarak kapalı bırakıldı; uygulamada o akışlar yok.
          apply "Şifre değişikliği bildirimi" "$(jq -n --rawfile c supabase/emails/password_changed.html \
            '{mailer_notifications_password_changed_enabled: true,
              mailer_subjects_password_changed_notification: "halka — şifren değiştirildi",
              mailer_templates_password_changed_notification_content: $c}')"

          apply "E-posta değişikliği bildirimi" "$(jq -n --rawfile c supabase/emails/email_changed_notification.html \
            '{mailer_notifications_email_changed_enabled: true,
              mailer_subjects_email_changed_notification: "halka — e-posta adresin değişti",
              mailer_templates_email_changed_notification_content: $c}')"

          apply "Giriş yöntemi eklendi bildirimi" "$(jq -n --rawfile c supabase/emails/identity_linked.html \
            '{mailer_notifications_identity_linked_enabled: true,
              mailer_subjects_identity_linked_notification: "halka — hesabına yeni giriş yöntemi eklendi",
              mailer_templates_identity_linked_notification_content: $c}')"

          apply "Giriş yöntemi kaldırıldı bildirimi" "$(jq -n --rawfile c supabase/emails/identity_unlinked.html \
            '{mailer_notifications_identity_unlinked_enabled: true,
              mailer_subjects_identity_unlinked_notification: "halka — bir giriş yöntemi kaldırıldı",
              mailer_templates_identity_unlinked_notification_content: $c}')"

          echo "" >> r.md
          echo "**Doğrulama:**" >> r.md
          curl -s --max-time 45 -H "Authorization: Bearer $TOKEN" "$URL" -o cfg.json
          jq -r 'to_entries[] | select(.key | test("password_min_length|^mailer_notifications_|^mailer_subjects_(password_changed|email_changed|identity_linked|identity_unlinked)")) | "- `\(.key)` = `\(.value)`"' cfg.json >> r.md
          echo "" >> r.md
          echo "_${OK}/$((OK+FAIL)) ayar uygulandı._" >> r.md

          cat r.md
          gh issue comment 30 --repo "$REPO" --body-file r.md
          [ "$FAIL" = "0" ]
