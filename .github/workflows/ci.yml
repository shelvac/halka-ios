# Manifesto §6.2: her push'ta lint → unit test → build.
# Not: private repoda macOS runner dakikaları 10x sayılır; bu yüzden yalnızca
# main'e push ve PR'larda çalışır.
name: CI

# macOS runner dakikaları 10 kat sayılır ve kuyruğu tıkar; bu yüzden CI
# her push'ta değil, yalnızca PR'larda ve elle tetiklendiğinde çalışır.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint version
          swiftlint

      - name: Build & Test (iPhone simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Halka.xcodeproj \
            -scheme Halka \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            CODE_SIGNING_ALLOWED=NO
