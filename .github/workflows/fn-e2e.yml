# Edge Function'ı GERÇEK bir kullanıcı oturumuyla uçtan uca test eder.
#
# Neden: cihazda "AI'a ulaşılamadı" görüldüğünde hatanın fonksiyonda mı,
# istemcide mi olduğunu ayırt etmenin tek yolu fonksiyonu uygulamanın
# yaptığı gibi (kullanıcı JWT'siyle) çağırmak. Test kullanıcısının şifresi
# her koşuda rastgele üretilir, hiçbir yere yazılmaz.
name: Fonksiyon E2E

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      URL: https://urrjkubdngoszkttpeph.supabase.co
      ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVycmprdWJkbmdvc3prdHRwZXBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMDA2MTcsImV4cCI6MjEwMTU3NjYxN30.Iy-48jUSh4ku-9ZRAPx6T0vDtINY3SKeunJRRA9qyd8
    steps:
      - name: Test kullanıcısı + çağrı
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          PW=$(openssl rand -hex 16)
          cat > user.sql <<SQL
          do \$\$
          declare uid uuid;
          begin
            select id into uid from auth.users where email = 'fntest@halka.internal';
            if uid is null then
              uid := gen_random_uuid();
              insert into auth.users
                (instance_id, id, aud, role, email, encrypted_password,
                 email_confirmed_at, raw_app_meta_data, raw_user_meta_data,
                 created_at, updated_at, confirmation_token, email_change,
                 email_change_token_new, recovery_token)
              values
                ('00000000-0000-0000-0000-000000000000', uid, 'authenticated',
                 'authenticated', 'fntest@halka.internal',
                 extensions.crypt('__PW__', extensions.gen_salt('bf')),
                 now(), '{"provider":"email","providers":["email"]}'::jsonb,
                 '{"full_name":"Fn Test"}'::jsonb, now(), now(), '', '', '', '');
              insert into auth.identities
                (id, user_id, identity_data, provider, provider_id,
                 last_sign_in_at, created_at, updated_at)
              values
                (gen_random_uuid(), uid,
                 jsonb_build_object('sub', uid::text, 'email', 'fntest@halka.internal'),
                 'email', uid::text, now(), now(), now());
            else
              update auth.users
                set encrypted_password = extensions.crypt('__PW__', extensions.gen_salt('bf')),
                    email_confirmed_at = coalesce(email_confirmed_at, now())
                where id = uid;
            end if;
          end \$\$;
          SQL
          sed -i "s/__PW__/$PW/g" user.sql
          BODY=$(jq -Rs '{query: .}' user.sql)
          CODE=$(curl -s -o sql.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/urrjkubdngoszkttpeph/database/query" -d "$BODY")
          echo "## Fonksiyon E2E · \`generate-meal-plan\`" > r.md
          echo "" >> r.md
          echo "- kullanıcı SQL: HTTP \`$CODE\` $(head -c 200 sql.json)" >> r.md

          JWT=$(curl -s -m 30 "$URL/auth/v1/token?grant_type=password" \
            -H "apikey: $ANON" -H "Content-Type: application/json" \
            -d "{\"email\":\"fntest@halka.internal\",\"password\":\"$PW\"}" | jq -r '.access_token // empty')
          if [ -z "$JWT" ]; then
            echo "- ❌ giriş başarısız (JWT alınamadı)" >> r.md
            gh issue comment 34 --repo "$REPO" --body-file r.md
            exit 1
          fi
          echo "- giriş ✅" >> r.md

          cat > input.json <<'JSON'
          {"input":{"hedef":"kilo_ver","kalori":1420,
            "makrolar":{"protein":90,"karb":150,"yag":47},
            "protokol":"Dengeli_TUBER","alerjiler":[],"sevilmeyenler":[],
            "ogun_sayisi":4,"ogun_saatleri":["09:00","13:00","16:30","19:00"],
            "gun":"sali","onceki_gunler_ozeti":[]}}
          JSON
          FCODE=$(curl -s -m 120 -o fn.json -w "%{http_code}" \
            "$URL/functions/v1/generate-meal-plan" \
            -H "Authorization: Bearer $JWT" -H "apikey: $ANON" \
            -H "Content-Type: application/json" -d @input.json)
          echo "- fonksiyon: HTTP \`$FCODE\`" >> r.md
          echo '```json' >> r.md
          head -c 1500 fn.json >> r.md
          echo "" >> r.md
          echo '```' >> r.md
          cat r.md
          gh issue comment 34 --repo "$REPO" --body-file r.md
          [ "$FCODE" = "200" ]
