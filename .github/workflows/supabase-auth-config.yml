# Auth yapılandırması (US-011/US-013 düzeltmeleri):
#   - E-posta doğrulaması AÇIK (kayıt → doğrulama maili → uygulamaya dönüş)
#   - Site URL + redirect'ler halka:// deep link şemasına yönlendirildi
#   - E-posta şablonları Türkçeleştirildi
name: Supabase Auth Config

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Auth ayarlarını uygula
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          config = {
              "mailer_autoconfirm": False,
              "site_url": "halka://login-callback",
              "uri_allow_list": "halka://login-callback,halka://reset-password",
              "mailer_subjects_confirmation": "halka — e-posta adresini doğrula",
              "mailer_subjects_recovery": "halka — şifreni sıfırla",
              "mailer_templates_confirmation_content": (
                  "<h2>halka'ya hoş geldin! 🎯</h2>"
                  "<p>Hesabını doğrulamak ve uygulamaya dönmek için aşağıdaki bağlantıya dokun:</p>"
                  "<p><a href=\"{{ .ConfirmationURL }}\">E-postamı doğrula</a></p>"
                  "<p>Bu kaydı sen yapmadıysan bu e-postayı yok sayabilirsin.</p>"),
              "mailer_templates_recovery_content": (
                  "<h2>Şifreni sıfırla</h2>"
                  "<p>halka hesabın için şifre sıfırlama isteği aldık. "
                  "Yeni şifreni belirlemek için aşağıdaki bağlantıya dokun:</p>"
                  "<p><a href=\"{{ .ConfirmationURL }}\">Şifremi sıfırla</a></p>"
                  "<p>Bu isteği sen yapmadıysan bu e-postayı yok sayabilirsin.</p>"),
          }
          req = urllib.request.Request(
              "https://api.supabase.com/v1/projects/urrjkubdngoszkttpeph/config/auth",
              method="PATCH",
              headers={
                  "Authorization": "Bearer " + os.environ["SUPABASE_ACCESS_TOKEN"],
                  "Content-Type": "application/json",
              },
              data=json.dumps(config).encode())
          with urllib.request.urlopen(req) as r:
              print("HTTP", r.status)
              body = json.load(r)
              for key in ("mailer_autoconfirm", "site_url", "uri_allow_list"):
                  print(key, "=", body.get(key))
          PY
