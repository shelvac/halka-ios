# Custom SMTP (Resend) + marka kimliğine uygun Türkçe e-posta şablonları (US-020).
#
# Neden gerekli:
#   1. Supabase'in varsayılan e-posta sağlayıcısı ücretsiz planda saatte yalnızca
#      birkaç e-posta gönderir — doğrulama/sıfırlama mailleri "gelmiyor".
#   2. Şablon özelleştirme yalnızca custom SMTP ile açılır.
#
# Şablonlar `supabase/emails/*.html` dosyalarından okunur — tasarımı değiştirmek
# için dosyayı düzenleyip bu workflow'u yeniden çalıştırmak yeterli.
#
# Gerekli secret'lar: SUPABASE_ACCESS_TOKEN, RESEND_API_KEY
name: Supabase SMTP + Şablonlar

on:
  workflow_dispatch:
    inputs:
      sender_email:
        description: "Gönderen adres (doğrulanmış alan adın yoksa onboarding@resend.dev)"
        required: true
        default: "onboarding@resend.dev"

permissions:
  issues: write

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      URL: https://api.supabase.com/v1/projects/urrjkubdngoszkttpeph/config/auth
    steps:
      - uses: actions/checkout@v4

      - name: SMTP + şablonları uygula
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND: ${{ secrets.RESEND_API_KEY }}
          SENDER: ${{ inputs.sender_email }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          echo "## SMTP + e-posta şablonları" > report.md
          echo "" >> report.md
          OK=0; FAIL=0

          apply() {   # $1 = etiket, $2 = json gövde
            CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X PATCH \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$URL" -d "$2")
            if [ "$CODE" = "200" ]; then
              echo "- ✅ $1" >> report.md; OK=$((OK+1))
            else
              echo "- ❌ $1 — \`$CODE: $(head -c 220 /tmp/resp.json | tr -d '\n')\`" >> report.md
              FAIL=$((FAIL+1))
            fi
          }

          # 1) SMTP bağlantısı (Resend)
          apply "Resend SMTP bağlantısı" "$(jq -n --arg pass "$RESEND" --arg sender "$SENDER" '{
            smtp_admin_email: $sender,
            smtp_host: "smtp.resend.com",
            smtp_port: "465",
            smtp_user: "resend",
            smtp_pass: $pass,
            smtp_sender_name: "halka",
            smtp_max_frequency: 5
          }')"

          # 2) Şablonlar — supabase/emails/*.html dosyalarından
          apply "Doğrulama e-postası" "$(jq -n --rawfile c supabase/emails/confirmation.html \
            '{mailer_subjects_confirmation: "halka — e-posta adresini doğrula",
              mailer_templates_confirmation_content: $c}')"

          apply "Şifre sıfırlama e-postası" "$(jq -n --rawfile c supabase/emails/recovery.html \
            '{mailer_subjects_recovery: "halka — şifreni sıfırla",
              mailer_templates_recovery_content: $c}')"

          apply "Giriş bağlantısı e-postası" "$(jq -n --rawfile c supabase/emails/magic_link.html \
            '{mailer_subjects_magic_link: "halka — giriş bağlantın",
              mailer_templates_magic_link_content: $c}')"

          apply "E-posta değişikliği" "$(jq -n --rawfile c supabase/emails/email_change.html \
            '{mailer_subjects_email_change: "halka — yeni e-posta adresini onayla",
              mailer_templates_email_change_content: $c}')"

          # 3) Diğer bildirim konularını da Türkçeleştir
          apply "Bildirim konuları (TR)" "$(jq -n '{
            mailer_subjects_password_changed_notification: "halka — şifren değiştirildi",
            mailer_subjects_email_changed_notification: "halka — e-posta adresin değişti",
            mailer_subjects_identity_linked_notification: "halka — hesabına yeni giriş yöntemi eklendi",
            mailer_subjects_identity_unlinked_notification: "halka — bir giriş yöntemi kaldırıldı"
          }')"

          echo "" >> report.md
          echo "**Doğrulama:**" >> report.md
          curl -s -H "Authorization: Bearer $TOKEN" "$URL" -o /tmp/cfg.json
          jq -r 'to_entries[] | select(.key | test("smtp_host|smtp_admin_email|smtp_sender_name|mailer_subjects_(confirmation|recovery|magic_link|email_change)$")) | "- `\(.key)` = `\(.value)`"' /tmp/cfg.json >> report.md
          echo "" >> report.md
          echo "_${OK}/$((OK+FAIL)) adım uygulandı._" >> report.md

          cat report.md
          gh issue comment 30 --repo "$REPO" --body-file report.md
          [ "$FAIL" = "0" ]
