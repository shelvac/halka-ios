# Derleme/test hatalarını issue yorumu olarak raporlar.
#
# Neden: Actions log dosyalarına (blob depolama) geliştirme ortamından
# erişilemiyor; hatayı görebilmek için çıktıyı repoya geri yazıyoruz.
# Ayrıca sonuç `ci-status` dalına yazılır: GitHub API'si geliştirme
# ortamından erişilemez olduğunda bile `git fetch` ile okunabilir.
name: CI Rapor

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      issue:
        description: "Raporun yazılacağı issue numarası"
        required: true
        default: "34"

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Cihaz adını sabitlemek kırılgan: runner imajı yenilenince
      # "iPhone 16 Pro" kayboldu ve derleme değil, hedef bulunamadığı için
      # düştü. Artık kurulu olanlardan biri seçiliyor.
      - name: Simülatör seç
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable and (.name | startswith("iPhone")))][0].udid // empty')
          if [ -z "$UDID" ]; then
            echo "Kullanılabilir iPhone simülatörü yok" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Derle ve test et
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project Halka.xcodeproj \
            -scheme Halka \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Raporla
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue || '34' }}
        run: |
          set +e
          echo "## CI raporu · \`$(git rev-parse --short HEAD)\`" > r.md
          echo "" >> r.md

          # Derleyici hataları ve test başarısızlıkları
          ERRORS=$(grep -E "error:|XCTAssert.*failed|failed -" build.log | head -40)
          if [ -n "$ERRORS" ]; then
            echo "### Hatalar" >> r.md
            echo '```' >> r.md
            echo "$ERRORS" >> r.md
            echo '```' >> r.md
          else
            echo "- Derleyici hatası bulunamadı; kuyruk aşağıda." >> r.md
          fi

          echo "" >> r.md
          echo "### Log kuyruğu" >> r.md
          echo '```' >> r.md
          tail -c 3000 build.log >> r.md
          echo "" >> r.md
          echo '```' >> r.md

          gh issue comment "$ISSUE" --repo "$REPO" --body-file r.md

      # Sonucu ci-status dalına yaz: geliştirme ortamı API'ye erişemese de
      # `git fetch origin ci-status && git show FETCH_HEAD:status.txt` ile
      # sonuç ve hata özeti okunabilir.
      - name: ci-status dalını güncelle
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -e
          RES=fail
          [ "${{ steps.build.outcome }}" = "success" ] && RES=ok
          mkdir -p /tmp/ci-status && cd /tmp/ci-status
          {
            echo "$RES $GITHUB_SHA $(date -u +%FT%TZ)"
            echo "---"
            grep -E "error:|XCTAssert.*failed|failed -|Executed .* tests" \
              "$GITHUB_WORKSPACE/build.log" 2>/dev/null | tail -30 || true
          } > status.txt
          git init -q -b ci-status .
          git add status.txt
          git -c user.name=halka-ci -c user.email=ci@halka.app \
            commit -qm "ci status $GITHUB_SHA"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-status

      # Rapor yazıldıktan sonra gerçek sonucu yansıt: derleme/test kırıksa
      # workflow da kırmızı bitmeli. (Eskiden continue-on-error yüzünden hep
      # yeşildi ve "başarılı" sanılıyordu.)
      - name: Derleme sonucunu işaretle
        if: steps.build.outcome != 'success'
        run: exit 1
