# Tek bir migration dosyasını Supabase'e uygular.
# Sonuç issue #19'a yorum olarak yazılır.
name: Supabase Migration

on:
  workflow_dispatch:
    inputs:
      file:
        description: "supabase/migrations altındaki dosya adı"
        required: true
        default: "0002_account_status.sql"

permissions:
  contents: read
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Migration uygula
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FILE: ${{ inputs.file }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          PATH_SQL="supabase/migrations/$FILE"
          echo "## Migration: \`$FILE\`" > r.md
          echo "" >> r.md
          if [ ! -f "$PATH_SQL" ]; then
            echo "- ❌ Dosya bulunamadı" >> r.md
            gh issue comment 19 --repo "$REPO" --body-file r.md
            exit 1
          fi
          BODY=$(jq -Rs '{query: .}' "$PATH_SQL")
          CODE=$(curl -s -o out.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/urrjkubdngoszkttpeph/database/query" -d "$BODY")
          echo "- HTTP \`$CODE\` → \`$(head -c 300 out.json | tr -d '\n')\`" >> r.md
          if [ "$CODE" = "200" ] || [ "$CODE" = "201" ]; then
            echo "- ✅ Uygulandı" >> r.md
          else
            echo "- ❌ Hata" >> r.md
          fi
          cat r.md
          gh issue comment 19 --repo "$REPO" --body-file r.md
          [ "$CODE" = "200" ] || [ "$CODE" = "201" ]
