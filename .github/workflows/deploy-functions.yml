# Edge Function'ları Supabase'e dağıtır + gerekli secret'ları tanımlar.
# Sonuç issue #30'a yorum olarak yazılır.
name: Edge Function Dağıt

on:
  workflow_dispatch:
    inputs:
      function:
        description: "Dağıtılacak fonksiyon adı"
        required: true
        default: "delete-account"

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REF: urrjkubdngoszkttpeph
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dağıt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FN: ${{ inputs.function }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          echo "## Edge Function dağıtımı · \`$FN\`" > r.md
          echo "" >> r.md

          # SMTP bilgileri fonksiyon secret'ı olarak (repoya veya uygulamaya girmez)
          supabase secrets set --project-ref "$REF" \
            GMAIL_ADDRESS=halkahealthapp@gmail.com \
            GMAIL_APP_PASSWORD="$GMAIL_APP_PASSWORD" > secrets.log 2>&1
          echo "- secrets set: \`$?\`" >> r.md

          supabase functions deploy "$FN" --project-ref "$REF" > deploy.log 2>&1
          CODE=$?
          echo "- deploy çıkış kodu: \`$CODE\`" >> r.md
          echo '```' >> r.md
          tail -c 1500 deploy.log >> r.md
          echo "" >> r.md
          echo '```' >> r.md

          cat r.md
          gh issue comment 30 --repo "$REPO" --body-file r.md
          [ "$CODE" = "0" ]
